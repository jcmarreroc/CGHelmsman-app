<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Helmsman — Flipbook (v3)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" sizes="192x192" href="assets/icon-192.png">
<meta name="theme-color" content="#063e79">
<style>
:root{--bg:#06131f;--ink:#e9f2ff;--muted:#9fb3c7;--accent:#4fc3f7;--panel:#0e2740;}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#05101b,#07263d 65%);color:var(--ink);font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;background:rgba(7,21,33,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08);z-index:10}
header .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
.wrap{max-width:1100px;margin:0 auto}
.links a{color:var(--accent);text-decoration:none;margin-right:12px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08)}
.toolbar .btn{background:var(--accent);color:#06223e;border:none;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.toolbar input{width:80px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:var(--ink);padding:6px 8px;border-radius:8px}
.pdf-area{height:calc(100vh - 150px);max-height:100vh}
@media (max-width:700px){.pdf-area{height:calc(100vh - 170px)}}
iframe{width:100%;height:100%;border:none;background:#0a1d2f}
.badge{display:inline-block;padding:4px 8px;border:1px solid rgba(255,255,255,.15);border-radius:999px;font-size:12px;color:var(--muted);margin-right:6px}
.footer{color:var(--muted);text-align:center;padding:12px}
.select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:var(--ink);padding:6px 8px;border-radius:8px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <img src="assets/icon-192.png" alt="" width="28" height="28" style="border-radius:6px">
    <h1>The Helmsman — Flipbook (v3)</h1>
    <span class="badge">Installable PWA</span><span class="badge">Offline-ready</span><span class="badge">Page controls</span>
  </div>
  <div class="wrap">
    <div class="links" id="linkbar"></div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <select id="docSel" class="select" title="Choose document"></select>
    <button class="btn" id="prevBtn" title="Previous page">◀ Prev</button>
    <div>Page <input id="pageNum" type="number" min="1" value="1"> <span id="pageInfo" class="small"></span></div>
    <button class="btn" id="nextBtn" title="Next page">Next ▶</button>
    <button class="btn" id="openBtn">Open full PDF</button>
    <div style="flex:1"></div>
    <label>Zoom
      <input id="zoom" type="range" min="80" max="200" step="5" value="125">
    </label>
  </div>
  <div class="pdf-area">
    <iframe id="pdfFrame" title="PDF Flipbook"></iframe>
  </div>
  <div class="footer">Tip: swipe left/right on touch devices to change pages. If a page doesn’t load, try a different zoom or tap “Open full PDF.”</div>
</div>

<script src="content.js"></script>
<script>
const L = window.APP;
const pdfFrame = document.getElementById('pdfFrame');
const pageNum = document.getElementById('pageNum');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const openBtn = document.getElementById('openBtn');
const pageInfo = document.getElementById('pageInfo');
const zoom = document.getElementById('zoom');
const docSel = document.getElementById('docSel');
let currentFile = null;

// Links
const linkbar=document.getElementById('linkbar');
Object.entries(L.links).forEach(([k,v])=>{const a=document.createElement('a');a.href=v;a.target='_blank';a.rel='noopener';a.textContent=k;linkbar.appendChild(a);});

// Docs dropdown
L.pdfs.forEach(d=>{ if(!d.file) return; const opt=document.createElement('option'); opt.value=d.file; opt.textContent=d.title; docSel.appendChild(opt);});
docSel.addEventListener('change', ()=>{ currentFile = docSel.value; goTo( parseInt(pageNum.value||'1'), true ); });
docSel.selectedIndex = 0; currentFile = docSel.value;

// Navigation
function buildSrc(file, page){ const z = zoom.value || 125; return file + '#page=' + page + '&zoom=' + z; }
function goTo(p, force=false){ const n = Math.max(1, parseInt(p||'1')); pageNum.value = n; const src = buildSrc(currentFile, n); if(force || pdfFrame.getAttribute('src') !== src){ pdfFrame.setAttribute('src', src); } pageInfo.textContent=''; }
prevBtn.addEventListener('click', ()=> goTo(parseInt(pageNum.value||'2') - 1) );
nextBtn.addEventListener('click', ()=> goTo(parseInt(pageNum.value||'0') + 1) );
pageNum.addEventListener('change', ()=> goTo(parseInt(pageNum.value||'1'), true) );
zoom.addEventListener('input', ()=> goTo(parseInt(pageNum.value||'1'), true) );
openBtn.addEventListener('click', ()=> window.open(buildSrc(currentFile, parseInt(pageNum.value||'1')), '_blank') );

// Swipe gestures
let touchStartX=null;
pdfFrame.addEventListener('load', ()=>{ // attach to frame parent for touch
  const area = document.querySelector('.pdf-area');
  area.addEventListener('touchstart', e=>{touchStartX = e.changedTouches[0].screenX;}, {passive:true});
  area.addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].screenX - (touchStartX||0);
    if(Math.abs(dx)>50){ if(dx<0) nextBtn.click(); else prevBtn.click(); }
  }, {passive:true});
});

// Initialize
goTo(1, true);
</script>
</body>
</html>
