<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Helmsman — CG Boot Camp Guide</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" sizes="192x192" href="assets/icon-192.png">
<meta name="theme-color" content="#024773">
<style>
:root{--bg:#071521;--paper:#0d2336;--ink:#e9f2ff;--muted:#9fb3c7;--accent:#4fc3f7;}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#05101b,#0a2031 65%);color:var(--ink);font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;background:rgba(7,21,33,.9);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08);padding:10px 16px;z-index:10}
header h1{margin:0;font-size:18px;letter-spacing:.3px}
.wrap{max-width:980px;margin:0 auto;padding:18px}
.toc{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px}
.toc a{display:block;color:var(--accent);text-decoration:none;margin:6px 0}
.section{background:var(--paper);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px;margin:16px 0}
.section h2{margin:0 0 8px 0}
ul{margin:8px 0 0 18px}
.links a{color:var(--accent);margin-right:12px}
hr{border:none;border-top:1px dashed rgba(255,255,255,.12);margin:16px 0}
.btn{background:var(--accent);color:#032033;border:none;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.quiz .q{margin:12px 0}
.quiz label{display:block;margin:8px 0;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);padding:10px;border-radius:10px}
.result{font-weight:700;margin-top:8px}
.small{font-size:12px;color:var(--muted)}
footer{text-align:center;color:var(--muted);padding:18px}
</style>
</head>
<body>
<header>
  <h1>The Helmsman — Coast Guard Boot Camp Guide</h1>
</header>
<div class="wrap">
  <div class="section">
    <p>Read this guide straight through. It mirrors the PDF-style info so you have everything up front. A short <strong>Readiness Check</strong> quiz is at the end.</p>
    <div class="links" id="linkbar"></div>
  </div>

  <div class="toc" id="toc"><strong>Contents</strong></div>

  <div id="guide"></div>

  <div class="section" id="quiz">
    <h2>Readiness Check (Short Quiz)</h2>
    <div class="quiz" id="quiz-host"></div>
    <button class="btn" id="check">Check answers</button>
    <button class="btn" id="reset" style="margin-left:8px;background:#81c784">Reset</button>
    <div class="small" id="score"></div>
  </div>
</div>

<footer>Semper Paratus — Add to Home Screen for offline use.</footer>

<script src="content.js"></script>
<script>
const L=window.APP_CONTENT;
// Links
const linkbar=document.getElementById('linkbar');
Object.entries(L.links).forEach(([k,v])=>{const a=document.createElement('a');a.href=v;a.target='_blank';a.rel='noopener';a.textContent=k;linkbar.appendChild(a);});
// TOC + Guide
const toc=document.getElementById('toc'); const host=document.getElementById('guide');
L.guide.forEach((s,i)=>{const id='s'+i;const a=document.createElement('a');a.href='#'+id;a.textContent=(i+1)+'. '+s.title;toc.appendChild(a);
const sec=document.createElement('div');sec.className='section';sec.id=id;sec.innerHTML='<h2>'+s.title+'</h2><ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>';host.appendChild(sec);});
// Quiz
const qh=document.getElementById('quiz-host');function buildQuiz(){qh.innerHTML=L.final_quiz.map((q,i)=>`<div class="q"><div><strong>Q${i+1}.</strong> ${q.q}</div>${q.choices.map((c,ci)=>`<label><input type="radio" name="q${i}" value="${ci}"> ${c}</label>`).join('')}<div class="result" id="r${i}"></div></div>`).join('');}
buildQuiz();
document.getElementById('check').addEventListener('click',()=>{let score=0;L.final_quiz.forEach((q,i)=>{const chosen=[...document.querySelectorAll('input[name="q'+i+'"]')].find(r=>r.checked);const val=chosen?parseInt(chosen.value):-1;const r=document.getElementById('r'+i);if(val===q.answer){r.textContent='✅ Correct. '+q.explain;score++;}else{r.textContent='❌ Not quite. '+q.explain;}});document.getElementById('score').textContent='Score: '+score+' / '+L.final_quiz.length;});
document.getElementById('reset').addEventListener('click',buildQuiz);
</script>
</body>
</html>
