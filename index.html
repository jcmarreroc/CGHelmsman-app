<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Helmsman — Flipbook (v3.3 Combined Quiz)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest?v=33">
<link rel="icon" sizes="192x192" href="assets/icon-192.png">
<meta name="theme-color" content="#063e79">
<style>
:root{--bg:#06131f;--ink:#e9f2ff;--muted:#9fb3c7;--accent:#4fc3f7;--panel:#0e2740;}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#05101b,#07263d 65%);color:var(--ink);font-family:-apple-system,system-ui,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;background:rgba(7,21,33,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08);z-index:10}
header .wrap{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
.wrap{max-width:1100px;margin:0 auto}
.links a{color:var(--accent);text-decoration:none;margin-right:12px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08)}
.toolbar .btn{background:var(--accent);color:#06223e;border:none;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.toolbar input{width:80px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:var(--ink);padding:6px 8px;border-radius:8px}
.pdf-area{height:calc(100vh - 150px);max-height:100vh}
@media (max-width:700px){.pdf-area{height:calc(100vh - 170px)}}
iframe{width:100%;height:100%;border:none;background:#0a1d2f}
.badge{display:inline-block;padding:4px 8px;border:1px solid rgba(255,255,255,.15);border-radius:999px;font-size:12px;color:var(--muted);margin-right:6px}
.footer{color:var(--muted);text-align:center;padding:12px}
.select{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:var(--ink);padding:6px 8px;border-radius:8px}
#internal{padding:16px}
#internal h2{margin-top:0}
#internal .panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px}
.small{font-size:12px;color:var(--muted)}
.quiz label{display:block;margin:10px 0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);padding:10px;border-radius:10px}
.btn2{background:#81c784;color:#06223e;border:none;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;margin-right:8px}
.result{font-weight:700;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <img src="assets/icon-192.png" alt="" width="28" height="28" style="border-radius:6px">
    <h1>The Helmsman — Flipbook (v3.3)</h1>
    <span class="badge">Installable PWA</span><span class="badge">Offline-ready</span><span class="badge">Flip pages</span>
  </div>
  <div class="wrap">
    <div class="links" id="linkbar"></div>
  </div>
</header>

<div class="wrap">
  <div class="toolbar">
    <select id="docSel" class="select" title="Choose document"></select>
    <button class="btn" id="prevBtn" title="Previous page">◀ Prev</button>
    <div>Page <input id="pageNum" type="number" min="1" value="1"> <span id="pageInfo" class="small"></span></div>
    <button class="btn" id="nextBtn" title="Next page">Next ▶</button>
    <button class="btn" id="openBtn">Open full PDF</button>
    <div style="flex:1"></div>
    <label>Zoom
      <input id="zoom" type="range" min="80" max="200" step="5" value="125">
    </label>
  </div>
  <div class="pdf-area" id="pdfArea">
    <iframe id="pdfFrame" title="PDF Flipbook" style="display:none"></iframe>
    <div id="internal" style="display:none"></div>
  </div>
  <div class="footer">Dropdown includes: Updated Standards, Combined Readiness Quiz, and all PDFs.</div>
</div>

<script src="content.js"></script>
<script>
const L = window.FLIP;
const pdfFrame = document.getElementById('pdfFrame');
const internal = document.getElementById('internal');
const pdfArea = document.getElementById('pdfArea');
const pageNum = document.getElementById('pageNum');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const openBtn = document.getElementById('openBtn');
const pageInfo = document.getElementById('pageInfo');
const zoom = document.getElementById('zoom');
const docSel = document.getElementById('docSel');
let current = null;

// Links
const linkbar=document.getElementById('linkbar');
Object.entries(L.links).forEach(([k,v])=>{const a=document.createElement('a');a.href=v;a.target='_blank';a.rel='noopener';a.textContent=k;linkbar.appendChild(a);});

// Populate docs
L.docs.forEach(d=>{const opt=document.createElement('option');opt.value=d.id;opt.textContent=d.title;docSel.appendChild(opt);});
docSel.addEventListener('change', ()=> loadDoc(docSel.value) );
docSel.selectedIndex=0; loadDoc(docSel.value);

// Helpers
function buildSrc(file, page){const z = zoom.value || 125;return file + '#page=' + page + '&zoom=' + z;}
function showPDF(){pdfFrame.style.display='block';internal.style.display='none';openBtn.disabled=false;pageNum.disabled=false;prevBtn.disabled=false;nextBtn.disabled=false;zoom.disabled=false;}
function showInternal(){pdfFrame.style.display='none';internal.style.display='block';openBtn.disabled=true;pageNum.disabled=true;prevBtn.disabled=true;nextBtn.disabled=true;zoom.disabled=true;}

function loadDoc(id){
  current = L.docs.find(x=>x.id===id);
  if(!current) return;
  if(current.type==='pdf'){
    showPDF();
    pageNum.value=1;
    pdfFrame.setAttribute('src', buildSrc(current.file, 1));
  }else if(current.type==='quiz'){
    showInternal();
    renderQuiz();
  }else{ // internal static HTML
    showInternal();
    internal.innerHTML = `<div class="panel">${current.html}</div>`;
  }
}

// Quiz renderer (combined)
function renderQuiz(){
  const Q=L.quiz;
  internal.innerHTML = `<div class="panel"><h2>Combined Readiness Quiz</h2><p class='small'>Topics: 11 General Orders, PT standards, ranks/rates, phonetic alphabet, military time.</p><div id="qh"></div><div style="margin-top:10px"><button class="btn2" id="check">Check answers</button><button class="btn2" id="reset">Reset</button><span class="small" id="score"></span></div></div>`;
  const qh=document.getElementById('qh');
  function draw(){
    qh.innerHTML = Q.map((q,i)=>`
      <div class="q">
        <div><strong>Q${i+1}.</strong> ${q.q}</div>
        ${q.choices.map((c,ci)=>`<label><input type="radio" name="q${i}" value="${ci}"> ${c}</label>`).join('')}
        <div class="result" id="r${i}"></div>
      </div>
    `).join('');
  }
  draw();
  document.getElementById('check').onclick=()=>{
    let score=0;
    Q.forEach((q,i)=>{
      const chosen=[...document.querySelectorAll('input[name="q'+i+'"]')].find(r=>r.checked);
      const val=chosen?parseInt(chosen.value):-1;
      const r=document.getElementById('r'+i);
      if(val===q.a){r.textContent='✅ Correct. '+q.e;score++;}else{r.textContent='❌ Not quite. '+q.e;}
    });
    document.getElementById('score').textContent=' Score: '+score+' / '+Q.length;
  };
  document.getElementById('reset').onclick=draw;
}

prevBtn.addEventListener('click', ()=> { pageNum.value = Math.max(1, parseInt(pageNum.value||'2')-1); if(current?.file) pdfFrame.setAttribute('src', buildSrc(current.file, pageNum.value)); });
nextBtn.addEventListener('click', ()=> { pageNum.value = parseInt(pageNum.value||'0')+1; if(current?.file) pdfFrame.setAttribute('src', buildSrc(current.file, pageNum.value)); });
pageNum.addEventListener('change', ()=> { if(current?.file) pdfFrame.setAttribute('src', buildSrc(current.file, parseInt(pageNum.value||'1'))); });
zoom.addEventListener('input', ()=> { if(current?.type==='pdf' && current?.file) pdfFrame.setAttribute('src', buildSrc(current.file, parseInt(pageNum.value||'1'))); });
openBtn.addEventListener('click', ()=> { if(current?.type==='pdf' && current?.file) window.open(buildSrc(current.file, parseInt(pageNum.value||'1')), '_blank'); });

// Swipe
let touchStartX=null;
pdfArea.addEventListener('touchstart', e=>{touchStartX = e.changedTouches[0].screenX;}, {passive:true});
pdfArea.addEventListener('touchend', e=>{const dx = e.changedTouches[0].screenX - (touchStartX||0); if(Math.abs(dx)>50){ if(dx<0) nextBtn.click(); else prevBtn.click(); }}, {passive:true});
</script>
</body>
</html>
